services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-}bentifiles-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - INTERNAL_API_URL=http://backend:4000
      - AUTH_TRUST_HOST=true
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bentifiles-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-}bentifiles-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - ./backend/.env

    depends_on:
      - python-microservice
    restart: unless-stopped
    networks:
      - bentifiles-network

  subscription-reminder-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-}bentifiles-subscription-reminder-worker
    command: ["npm", "run", "worker:subscription-reminders"]
    environment:
      - SUBSCRIPTION_REMINDER_WORKER_MODE=loop
      - SUBSCRIPTION_REMINDER_WORKER_POLL_MS=60000
      - SUBSCRIPTION_REMINDER_WORKER_MAX_BACKOFF_MS=900000
      - SUBSCRIPTION_REMINDER_WORKER_ALERT_COOLDOWN_MS=900000
    env_file:
      - ./backend/.env
    restart: unless-stopped
    profiles:
      - workers
    networks:
      - bentifiles-network

  python-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-}bentifiles-python-microservice
    ports:
      - "${MICROSERVICE_PORT:-8000}:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - bentifiles-network

networks:
  bentifiles-network:
    driver: bridge

