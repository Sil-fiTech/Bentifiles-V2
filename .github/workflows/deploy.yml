name: Deploy

# main -> producao, dev -> ambiente dev (mesma VPS). Dispara apos CI verde; tambem manual.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente"
        type: choice
        options: [dev, prod]
        default: dev
      sha:
        description: "Commit SHA (vazio = ponta da branch; serve para rollback)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev') }}
      cancel-in-progress: false
    steps:
      - name: Resolve target
        id: t
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "env=$INPUT_TARGET" >> "$GITHUB_OUTPUT"
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            [ "$RUN_BRANCH" = "main" ] && echo "env=prod" >> "$GITHUB_OUTPUT" || echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          SSH_USER: ${{ secrets.VPS_USER }}
          TARGET: ${{ steps.t.outputs.env }}
          SHA: ${{ steps.t.outputs.sha }}
        run: |
          # A chave so executa /usr/local/bin/bentifiles-deploy (forced command na VPS).
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" "$SSH_USER@$HOST" "$TARGET $SHA"
