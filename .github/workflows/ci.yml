name: CI

on:
  pull_request:
  push:
    branches: [main, dev, dev-V2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detecta quais areas o diff tocou; jobs de areas intocadas sao pulados (skipped nao quebra o CI).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      microservice: ${{ steps.f.outputs.microservice }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            microservice:
              - 'microservice/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (build + test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (lint + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lint nao bloqueia por enquanto (ha debito existente); remova o continue-on-error quando limpo.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Transitorio: a producao ainda builda microservice/ deste repo. Remover junto com a pasta
  # quando a producao passar a usar a imagem do motor (repo document-quality-pipeline).
  microservice:
    name: Microservice (smoke test)
    needs: changes
    if: needs.changes.outputs.microservice == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: microservice/requirements.txt
      - name: System deps (OpenCV / Tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0 tesseract-ocr
      - run: pip install -r requirements.txt httpx
      - run: python test_api.py

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Cada imagem so builda se a propria area mudou e o proprio teste passou; falha de outra area nao bloqueia.
    # (matrix nao existe no `if` do job, entao a condicao fica nos steps.)
    needs: [changes, backend, frontend, microservice]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, microservice]
    env:
      RUN: ${{ needs.changes.outputs[matrix.service] == 'true' && needs[matrix.service].result == 'success' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v4
      - if: env.RUN == 'true'
        uses: docker/setup-buildx-action@v3
      - if: env.RUN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
