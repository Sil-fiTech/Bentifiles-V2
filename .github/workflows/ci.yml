name: CI

on:
  pull_request:
  push:
    branches: [main, dev, dev-V2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lint nao bloqueia por enquanto (ha debito existente); remova o continue-on-error quando limpo.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  microservice:
    name: Microservice (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: microservice/requirements.txt
      - name: System deps (OpenCV / Tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0 tesseract-ocr
      - run: pip install -r requirements.txt httpx
      - run: python test_api.py

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend, microservice]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, microservice]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
